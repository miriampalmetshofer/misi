name: Vercel Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: vercel-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME || 'misi' }}
  NEON_DATABASE_ROLE: ${{ vars.NEON_DATABASE_ROLE || 'neondb_owner' }}
  NEON_PREVIEW_PARENT_BRANCH: ${{ vars.NEON_PREVIEW_PARENT_BRANCH || 'production' }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare preview metadata
        id: preview
        run: |
          expires_at="$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')"
          pr_number="${{ github.event.workflow_run.pull_requests[0].number }}"
          head_branch="${{ github.event.workflow_run.head_branch }}"
          branch_name="preview/pr-${pr_number}-${head_branch}"

          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Create Neon preview branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: ${{ steps.preview.outputs.branch_name }}
          parent_branch: ${{ env.NEON_PREVIEW_PARENT_BRANCH }}
          database: ${{ env.NEON_DATABASE_NAME }}
          role: ${{ env.NEON_DATABASE_ROLE }}
          expires_at: ${{ steps.preview.outputs.expires_at }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Run migrations on Neon preview branch
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.create-branch.outputs.db_url }}
        run: npm run db:migrate

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Vercel preview
        id: deploy
        env:
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_pooled }}
          DATABASE_URL_UNPOOLED: ${{ steps.create-branch.outputs.db_url }}
        run: |
          url="$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} \
            --env DATABASE_URL="$DATABASE_URL" \
            --env DATABASE_URL_UNPOOLED="$DATABASE_URL_UNPOOLED" \
            --build-env DATABASE_URL="$DATABASE_URL" \
            --build-env DATABASE_URL_UNPOOLED="$DATABASE_URL_UNPOOLED")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Neon branch: ${{ steps.preview.outputs.branch_name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment with preview details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.preview.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          NEON_BRANCH_NAME: ${{ steps.preview.outputs.branch_name }}
          NEON_BRANCH_ID: ${{ steps.create-branch.outputs.branch_id }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Preview deployment: $PREVIEW_URL

Neon preview branch: $NEON_BRANCH_NAME
Neon branch ID: $NEON_BRANCH_ID"
