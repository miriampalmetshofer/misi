name: Neon Preview Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

env:
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

jobs:
  delete-preview-branch:
    name: Delete Neon preview branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate cleanup configuration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          missing=0
          for name in NEON_PROJECT_ID NEON_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions configuration: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
