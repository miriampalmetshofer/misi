name: Neon Preview Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

env:
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

jobs:
  delete-preview-branch:
    name: Delete Neon preview branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate cleanup configuration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          missing=0
          for name in NEON_PROJECT_ID NEON_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions configuration: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare preview metadata
        id: preview
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          safe_head_branch="$(printf '%s' "$HEAD_BRANCH" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-' | cut -c1-40)"
          branch_name="preview/pr-${PR_NUMBER}-${safe_head_branch}"

          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.preview.outputs.branch_name }}
          api_key: ${{ secrets.NEON_API_KEY }}
